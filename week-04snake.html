<!DOCTYPE html>
<html>
<head>
  <title>funny snak gam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">Back to Ittalian brainrot shrine</a></p>
  <h1>Funny snae gameee</h1>
  <canvas id="funnySnake" width="400" height="400"></canvas>
</body>
  <iframe src="https://scratch.mit.edu/projects/807117000/embed" allowtransparency="true" width="485" height="402" frameborder="0" scrolling="no" allowfullscreen></iframe>
<script>
  var canvas = document.getElementById("funnySnake");
  var ctx = canvas.getContext("2d");
  var CELL = 20;
  var snake = {x: 10, y: 10 };
  var speed = 100;
  function DrawFunnyBoard() {
  ctx.fillStyle= "#00ee00";
  ctx.fillRect(0, 0, 600, 600);
  
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(snake.x * CELL, snake.y * CELL, CELL, CELL);

  ctx.fillStyle = "#00ffff";
  ctx.fillRect(snake.x, snake.y, 20, 20);
  }
  var dx =20;
  var dy =0;
  function step() {
    document.addEventListener("keydown", function(event) {
  console.log(event.key);
    if (event.key==="a") {dy = 0; dx = -20;}
    if (event.key==="s") {dy=20;dx=0;}
    if (event.key==="w") {dy=-20;dx=0}
    if (event.key==="d") {dy=0;dx=20}
    });
    if (snake.x > 399) {snake.x = 1} 
    if (snake.x < 0) {snake.x = 399}
    if (snake.y > 399) {snake.y = 1}
    if (snake.y < 1) {snake.y = 399}
    snake.x = snake.x + dx;
    snake.y = snake.y + dy;
    DrawFunnyBoard();
  }
  setInterval(step, speed); 
</script>
</html>
