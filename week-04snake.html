<!DOCTYPE html>
<html>
<head>
  <title>funny snak gameew</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>funny snak gameew</h1>
  <p><a href="index.html">Back to brainrot shrine</a></p>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <script>
    // --- SETUP ---
    var canvas = document.getElementById("gameCanvas");
    var ctx = canvas.getContext("2d");

    // --- GAME STATE ---
    var snake = { x: 20, y: 20 };
    var dx = 20;                  
    var dy = 0;                   
    var body = [];                
    var snakeLength = 3;          
    var apple = { x: 200, y: 200 };

    // --- DRAWING FUNCTION ---
    function drawBoard() {
      ctx.fillStyle = "#00aa88";
      ctx.fillRect(0, 0, 400, 400);

      ctx.fillStyle = "red";
      ctx.fillRect(apple.x, apple.y, 20, 20);

      ctx.fillStyle = "#ff00ff";
      ctx.fillRect(snake.x, snake.y, 20, 20);
      
      for (var i = 0; i < body.length; i++) {
        ctx.fillRect(body[i].x, body[i].y, 20, 20);
      }
    }

    var timer = setInterval(step, 100);

    // --- MAIN GAME LOOP ---
    function step() {
      // 1. Move the snake head
      snake.x = snake.x + dx;
      snake.y = snake.y + dy;

      // 2. Wrap around screen edges
      if (snake.x > 380) { snake.x = 0; }
      if (snake.x < 0) { snake.x = 380; }
      if (snake.y > 380) { snake.y = 0; }
      if (snake.y < 0) { snake.y = 380; }

      // 3. Track the body
      body.push({ x: snake.x, y: snake.y });
      while (body.length > snakeLength) {
        body.shift();
      }

      // 4. Check for Apple Collision
      if (
        snake.x < apple.x + 20 &&
        snake.x + 20 > apple.x &&
        snake.y < apple.y + 20 &&
        snake.y + 20 > apple.y
      ) {
        snakeLength = snakeLength + 1; 
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;
      }

      // 5. Check for Game Over (Self Collision)
      for (var i = 0; i < body.length - 1; i++) {
        if (body[i].x === snake.x && body[i].y === snake.y) {
          // INSTEAD of stopping the game, we reset all variables to their starting state
          snake = { x: 200, y: 200 };
          dx = 20;
          dy = 0;
          body = [];
          snakeLength = 3;
          apple = { x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20 };
          
          return; // Exit this frame early so it starts clean on the next tick
        }
      }

      // 6. Draw the updated state to the screen
      drawBoard();
    }

    // --- CONTROLS ---
    document.addEventListener("keydown", function(event) {
      if (event.key === "d") {
        dx = 20;
        dy = 0;
      }
      if (event.key === "a") {
        dx = -20;
        dy = 0;
      }
      if (event.key === "w") {
        dx = 0;
        dy = -20;
      }
      if (event.key === "s") {
        dx = 0;
        dy = 20;
      }
    });
  </script>
</body>
</html>
